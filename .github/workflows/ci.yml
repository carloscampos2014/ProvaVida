name: CI — Build e Testes

on:
  pull_request:
    branches:
      - master
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build e Testes Unitários (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore src/ProvaVida.Api/ProvaVida.Api.csproj

      - name: Build
        run: dotnet build src/ProvaVida.Api/ProvaVida.Api.csproj -c Debug --no-restore

      - name: Testes unitários
        run: dotnet test tests/ProvaVida.Application.Tests/ --logger "console;verbosity=minimal" --no-restore

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ProvaVida.slnx

      - name: Build
        run: dotnet build ProvaVida.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ProvaVida.slnx --configuration Release --no-build --verbosity normal --filter "FullyQualifiedName!~Mobile.App"

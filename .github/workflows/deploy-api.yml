name: Deploy API

on:
  push:
    branches:
      - master
    paths:
      - "src/ProvaVida.Api/**"
      - "src/ProvaVida.Application/**"
      - "src/ProvaVida.Infrastructure/**"
      - "src/ProvaVida.Domain/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish e Deploy API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore src/ProvaVida.Api/ProvaVida.Api.csproj

      - name: Testes unitários
        run: dotnet test tests/ProvaVida.Application.Tests/ --logger "console;verbosity=minimal" --no-restore

      - name: Publish API
        run: |
          dotnet publish src/ProvaVida.Api/ProvaVida.Api.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o ./publish/api

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Usa o fingerprint pré-aprovado do host (stored como secret) — evita MITM no keyscan dinâmico
          echo "${{ secrets.SSH_KNOWN_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Parar serviço na VM
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "sudo systemctl stop provavida-api || true"

      - name: Preparar diretório na VM
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "sudo mkdir -p /opt/provavida/api && sudo chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} /opt/provavida/api"

      - name: Enviar arquivos para VM
        run: |
          rsync -rlptz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            ./publish/api/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/provavida/api/

      - name: Atualizar variáveis de ambiente na VM
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          sudo mkdir -p /etc/provavida
          sudo tee /etc/provavida/env > /dev/null << ENVEOF
          ASPNETCORE_ENVIRONMENT=Production
          ASPNETCORE_URLS=http://localhost:5001
          ConnectionStrings__Default=${{ secrets.DB_CONNECTION_STRING }}
          Jwt__SecretKey=${{ secrets.JWT_SECRET }}
          Jwt__Issuer=ProvaVida
          Jwt__Audience=ProvaVida
          Jwt__ExpirationHours=24
          Email__Usuario=${{ secrets.EMAIL_USUARIO }}
          Email__Senha=${{ secrets.EMAIL_SENHA }}
          WhatsApp__Token=${{ secrets.WHATSAPP_TOKEN }}
          WhatsApp__PhoneNumberId=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          Twilio__AccountSid=${{ secrets.TWILIO_ACCOUNT_SID }}
          Twilio__AuthToken=${{ secrets.TWILIO_AUTH_TOKEN }}
          Twilio__FromWhatsApp=${{ secrets.TWILIO_WHATSAPP_FROM }}
          Twilio__FromSms=${{ secrets.TWILIO_SMS_FROM }}
          Twilio__FromVoice=${{ secrets.TWILIO_VOICE_FROM }}
          Admin__ApiKey=${{ secrets.ADMIN_API_KEY }}
          ENVEOF
          sudo chmod 600 /etc/provavida/env
          sudo chown root:root /etc/provavida/env
          EOF

      - name: Ajustar permissões e iniciar serviço
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "sudo chown -R www-data:www-data /opt/provavida/api && \
               sudo systemctl enable provavida-api && \
               sudo systemctl start provavida-api"

      - name: Aguardar serviço iniciar
        run: sleep 15

      - name: Verificar health check
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "curl -f -H 'Host: provida-api.enzojb.com.br' http://localhost:80/health || \
               (sudo systemctl status provavida-api && exit 1)"

      - name: Purgar cache do Cloudflare
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | grep -q '"success":true' && echo "Cache purgado com sucesso" || echo "Aviso: purge pode ter falhado"

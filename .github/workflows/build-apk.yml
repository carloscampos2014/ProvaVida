name: Build APK Release

on:
  push:
    branches:
      - master
    paths:
      - "mobile/ProvaVida.Maui/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do release (ex: v1.1.0). Deixe vazio para só gerar o APK sem criar release."
        required: false
        default: ""

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK Release (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache MAUI workload
        uses: actions/cache@v4
        id: cache-maui
        with:
          path: |
            ~/.dotnet/workloads
            ${{ env.DOTNET_ROOT }}/sdk-manifests
            ${{ env.DOTNET_ROOT }}/packs
          key: maui-workload-${{ runner.os }}-net10-${{ hashFiles('mobile/ProvaVida.Maui/ProvaVida.Maui.csproj') }}
          restore-keys: |
            maui-workload-${{ runner.os }}-net10-
            maui-workload-${{ runner.os }}-

      - name: Install MAUI workload
        if: steps.cache-maui.outputs.cache-hit != 'true'
        run: dotnet workload install maui-android

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore mobile/ProvaVida.Maui/ProvaVida.Maui.csproj

      - name: Decode keystore
        run: |
          $keystoreBytes = [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
          [IO.File]::WriteAllBytes("mobile/ProvaVida.Maui/provavida.keystore", $keystoreBytes)
        shell: pwsh

      - name: Build APK Release
        run: |
          $version = "${{ github.event.inputs.version }}"
          # Remove o 'v' prefixo para o ApplicationDisplayVersion (ex: v1.0.3 → 1.0.3)
          $displayVersion = if ($version -match '^v?(.+)$') { $Matches[1] } else { "1.0.0" }
          # ApplicationVersion é um inteiro incremental — usa o run_number do GitHub
          $appVersion = "${{ github.run_number }}"

          dotnet publish mobile/ProvaVida.Maui/ProvaVida.Maui.csproj `
            --no-restore `
            -f net10.0-android `
            -c Release `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore=provavida.keystore `
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" `
            -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}" `
            -p:AndroidSigningStorePass="${{ secrets.ANDROID_STORE_PASSWORD }}" `
            -p:ApplicationDisplayVersion="$displayVersion" `
            -p:ApplicationVersion="$appVersion"
        shell: pwsh

      - name: Renomear APK
        id: apk
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="dev-${{ github.run_number }}"; fi
          SRC=$(find mobile/ProvaVida.Maui/bin/Release/net10.0-android -name "*-Signed.apk" | head -1)
          DEST="ProvaVida-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "apk_path=$DEST" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ProvaVida-Release-APK
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Criar GitHub Release
        if: ${{ github.event.inputs.version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ProvaVida ${{ github.event.inputs.version }}
          body: |
            ## ProvaVida ${{ github.event.inputs.version }}

            ### Instalação
            1. Baixe o arquivo `ProvaVida-${{ github.event.inputs.version }}.apk`
            2. No Android, habilite **Instalar apps de fontes desconhecidas** nas configurações
            3. Abra o APK e instale

            ### Requisitos
            - Android 7.0 (API 24) ou superior
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: false

      - name: Limpar keystore
        if: always()
        run: Remove-Item mobile/ProvaVida.Maui/provavida.keystore -Force -ErrorAction SilentlyContinue
        shell: pwsh

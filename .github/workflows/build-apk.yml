name: Build APK Release

on:
  push:
    branches:
      - master
    paths:
      - "mobile/ProvaVida.Maui/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do release (ex: v1.1.0). Deixe vazio para só gerar o APK sem criar release."
        required: false
        default: ""

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build APK Release (Android)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore mobile/ProvaVida.Maui/ProvaVida.Maui.csproj

      - name: Decode keystore
        run: |
          $keystoreBytes = [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
          [IO.File]::WriteAllBytes("mobile/ProvaVida.Maui/provavida.keystore", $keystoreBytes)
        shell: pwsh

      - name: Build APK Release
        run: |
          dotnet publish mobile/ProvaVida.Maui/ProvaVida.Maui.csproj `
            -f net10.0-android `
            -c Release `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore=provavida.keystore `
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" `
            -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}" `
            -p:AndroidSigningStorePass="${{ secrets.ANDROID_STORE_PASSWORD }}"
        shell: pwsh

      - name: Renomear APK
        id: apk
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "dev-${{ github.run_number }}" }
          $src = Get-ChildItem "mobile/ProvaVida.Maui/bin/Release/net10.0-android/*-Signed.apk" | Select-Object -First 1
          $dest = "ProvaVida-$version.apk"
          Copy-Item $src.FullName $dest
          echo "apk_path=$dest" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ProvaVida-Release-APK
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Criar GitHub Release
        if: ${{ github.event.inputs.version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ProvaVida ${{ github.event.inputs.version }}
          body: |
            ## ProvaVida ${{ github.event.inputs.version }}

            ### Instalação
            1. Baixe o arquivo `ProvaVida-${{ github.event.inputs.version }}.apk`
            2. No Android, habilite **Instalar apps de fontes desconhecidas** nas configurações
            3. Abra o APK e instale

            ### Requisitos
            - Android 7.0 (API 24) ou superior
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: false

      - name: Limpar keystore
        if: always()
        run: Remove-Item mobile/ProvaVida.Maui/provavida.keystore -Force -ErrorAction SilentlyContinue
        shell: pwsh

# Codex — MCP Configuration
# Escopo: projeto (equivale ao ~/.codex/config.toml mas scoped para este repo)
# Apenas projetos "trusted" carregam este arquivo automaticamente.
#
# Documentação: https://developers.openai.com/codex/mcp/

# ── GitHub ────────────────────────────────────────────────────────────────────
[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env_vars = ["GITHUB_PERSONAL_ACCESS_TOKEN"]

# ── Filesystem ────────────────────────────────────────────────────────────────
[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "C:\Dev\ProvaVida"]

# ── Fetch (busca de URLs externas) ───────────────────────────────────────────
[mcp_servers.fetch]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-fetch"]

# ── Memory (persistência entre sessões) ──────────────────────────────────────
[mcp_servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]

# ── PostgreSQL (descomentar e ajustar se o projeto usa Postgres) ──────────────
